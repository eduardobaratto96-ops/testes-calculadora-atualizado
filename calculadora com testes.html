<!DOCTYPE html>
<html>

<head>
  <title>Calculadora simples</title>
  <script>
    function somar(a, b) {
      return a + b;
    }

    function subtrair(a, b) {
      return a - b;
    }

    function multiplicar(a, b) {
      return a * b;
    }

    function dividir(a, b) {
      if (b === 0) return "Não é possível dividir por zero!";
      return a / b;
    }

    function clicarSomar() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      document.getElementById("resultado").innerHTML = "Resultado: " + somar(n1, n2);
    }

    function clicarSubtrair() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      document.getElementById("resultado").innerHTML = "Resultado: " + subtrair(n1, n2);
    }

    function clicarMultiplicar() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      document.getElementById("resultado").innerHTML = "Resultado: " + multiplicar(n1, n2);
    }

    function clicarDividir() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      document.getElementById("resultado").innerHTML = "Resultado: " + dividir(n1, n2);
    }

    function testar(descricao, fn) {
      try {
        fn();
        document.getElementById("resultados-testes").innerHTML += "✅ PASSOU: " + descricao + "<br>";
      } catch (e) {
        document.getElementById("resultados-testes").innerHTML += "❌ FALHOU: " + descricao + " → " + e.message + "<br>";
      }
    }

    function rodarTestes() {
      document.getElementById("resultados-testes").innerHTML = "";

      testar("Input vazio retorna NaN", () => {
        document.getElementById("num1").value = "";
        document.getElementById("num2").value = "";
        clicarSomar();
        const resultado = document.getElementById("resultado").innerHTML;
        if (resultado !== "Resultado: NaN") throw new Error("Esperado NaN");
      });

      testar("Soma com negativos", () => {
        if (somar(-3, -4) !== -7) throw new Error("Esperado -7");
      });

      testar("Soma negativo com positivo", () => {
        if (somar(-3, 4) !== 1) throw new Error("Esperado 1");
      });
      testar("Soma de positivos", () => {
        if (somar(3, 4) !== 7) throw new Error("Esperado 7");
      });
      testar("Subtração simples", () => {
        if (subtrair(10, 3) !== 7) throw new Error("Esperado 7");
      });
      if (multiplicar(3, 4) !== 12) throw new Error("Esperado 12");
      testar("Multiplicação", () => {
      });
      testar("Divisão por zero", () => {
        if (dividir(10, 0) !== "Não é possível dividir por zero!") throw new Error("Esperado mensagem de erro");
      });
      testar("Input aceita número", () => {
        document.getElementById("num1").value = 5;
        if (document.getElementById("num1").value !== "5") throw new Error("Esperado 5");
      });
      testar("Botão somar atualiza resultado", () => {
        document.getElementById("num2").value = 4;
        document.getElementById("num1").value = 3;
        clicarSomar();
        const resultado = document.getElementById("resultado").innerHTML;
        if (resultado !== "Resultado: 7") throw new Error("Esperado 'Resultado: 7'");
      });
      testar("Divisão por zero exibe mensagem", () => {
        document.getElementById("num1").value = 10;
        document.getElementById("num2").value = 0;
        clicarDividir();
        const resultado = document.getElementById("resultado").innerHTML;
        if (resultado !== "Resultado: Não é possível dividir por zero!") throw new Error("Mensagem errada");
      });
    }
    
    
    </script>
</head>
<body>
  <button onclick="clicarSomar()">Somar</button>
  <input id="num1" type="number" placeholder="Número 1">
  <input id="num2" type="number" placeholder="Número 2">
  <br><br>
  <button onclick="clicarSubtrair()">Subtrair</button>
  <button onclick="clicarMultiplicar()">Multiplicar</button>
  <button onclick="clicarDividir()">Dividir</button>
  <br>
  <p id="resultado">Resultado:</p>
  <hr>
  <h3>Testes:</h3>
  <button onclick="rodarTestes()">Rodar Testes</button>
  <br><br>
  <div id="resultados-testes"></div>
</body>
</html>
